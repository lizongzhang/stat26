<!-- 1. 右下角 Home 按钮（完全使用原有的位置与大尺寸参数） -->
<div style="
  position: fixed;
  bottom: 50px;
  right: 20px;
  z-index: 1000;
">
  <a href="https://lizongzhang.github.io/metrics26i" 
     style="
       display: inline-flex;
       align-items: center;
       gap: 8px;
       padding: 10px 20px;
       background-color: rgba(255, 255, 255, 0.75);
       color: #1a5f7a;
       text-decoration: none;
       border: 1.5px solid rgba(26, 95, 122, 0.35);
       border-radius: 10px;
       font-size: 18px;
       font-weight: bold;
       font-family: Arial, sans-serif;
       backdrop-filter: blur(6px);
       -webkit-backdrop-filter: blur(6px);
       box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
       transition: all 0.2s ease-in-out;
     "
     onmouseover="this.style.backgroundColor='#1a5f7a'; this.style.color='#ffffff'; this.style.borderColor='#1a5f7a';"
     onmouseout="this.style.backgroundColor='rgba(255, 255, 255, 0.75)'; this.style.color='#1a5f7a'; this.style.borderColor='rgba(26, 95, 122, 0.35)';"
  >
    <span>🏠</span> Home
  </a>
</div>
